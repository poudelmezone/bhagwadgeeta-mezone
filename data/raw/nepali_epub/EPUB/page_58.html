    <p> पदी छौ : योगाभ्यासमा उन्नत योगीहरूले आफ्ना शरीर त्याग गनं समय र स्थानको व्यवस्था गर्न सक्दच्छन्‌। अन्य कसैको यसमा कुनै नियन्त्रण इृदन । (८.२४ तात्पर्य) ।  </p>
