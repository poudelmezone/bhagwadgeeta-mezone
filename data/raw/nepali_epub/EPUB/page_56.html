    <p>4 ग पड़ी चार : संसारका सबै भौतिक क्रियाकलापहरू प्रकृतिका तीन गुणहरूका अधीनमा सञ्चालित हुने गर्दछन्‌। प्रकृतिका गुणहरू परमेश्वर श्रीकृष्णबाट उत्पन्न हुन्छन्‌ तापनि भगवान्‌ श्रीकृष्ण तिनका अधीनमा ` छैनन्‌। (७.१२ तात्पर्य) |  । </p>
