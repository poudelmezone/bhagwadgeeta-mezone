    <p>  श्रीमद्भगवद्गीता यथारूप अध्याय १८ ७ गरेर क श्रीकष्णको प्रत्यक्ष आदेशअन्तर्गत पर्दछ। यसरी जीवले आह्लादिनी शक्तिअन्तर्गत आफ्नो सामान्य अवस्थालाई प्राप्त गर्न सक्दछ । ? यस प्रकार श्रीमद्भगवद्गीता ग्रन्थअन्तर्गत “उपसंहारः संन्यासको पूर्णता शीर्षक अठारौँ अध्यायको भक्तिवेदान्त तात्पर्य समाप्त भयो ।</p>
