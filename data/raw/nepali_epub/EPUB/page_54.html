    <p>न्द ^ ०, ११ ओ 3 च ५४ ॥  पट्टी दुई : भगवान्‌ श्रीकृष्णले भन्नुभयो, “जसरी मान्छेले पुराना वस्त्रहरु त्यागेर नया वस्त्र धारण गर्दछ, त्यसैगरी आत्माले पनि पुराना तथा व्यर्थका शरीरहरूलाई त्यागी नवीन भौतिक शरीर धारण गर्दछ्‌।” (२,२२) </p>
