<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Gita — Bhagavad Gita</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gita">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <!-- top bar (rendered per screen) -->
    <header id="topbar"></header>

    <!-- scrolling screen content -->
    <main id="view"></main>

    <!-- floating reader transport controls -->
    <div id="transport" class="hidden">
      <button class="tp-btn" id="tpPrev" aria-label="Previous verse">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button class="tp-btn" id="tpPlay" aria-label="Listen">
        <svg viewBox="0 0 24 24" class="ic-play"><path d="M8 5l11 7-11 7z"/></svg>
        <svg viewBox="0 0 24 24" class="ic-pause hidden"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
      </button>
      <button class="tp-btn" id="tpNext" aria-label="Next verse">
        <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>

    <!-- bottom navigation -->
    <nav id="tabbar">
      <button class="tab" data-tab="today">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
        <span>Today</span>
      </button>
      <button class="tab" data-tab="read">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8 9.5h8M8 14.5h5"/></svg>
        <span>Gita</span>
      </button>
      <button class="tab" data-tab="guides">
        <svg viewBox="0 0 24 24"><path d="M9 5.5 3.5 7.5v11L9 16.5l6 2 5.5-2v-11L15 7.5z"/><path d="M9 5.5v11M15 7.5v11"/></svg>
        <span>Guides</span>
      </button>
      <button class="tab" data-tab="profile">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5.5 19.5c1.2-3.4 3.7-5 6.5-5s5.3 1.6 6.5 5"/></svg>
        <span>Profile</span>
      </button>
      <button class="tab" data-tab="more">
        <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
        <span>More</span>
      </button>
    </nav>

    <!-- modal layer -->
    <div id="sheetLayer" class="hidden">
      <div id="sheetScrim"></div>
      <div id="sheet" role="dialog" aria-modal="true"></div>
    </div>
    <div id="modalLayer" class="hidden">
      <div id="modalScrim"></div>
      <div id="modal" role="dialog" aria-modal="true"></div>
    </div>
    <div id="toast" class="hidden"></div>
  </div>

  <script src="data/gita.js"></script>
  <script src="js/state.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
